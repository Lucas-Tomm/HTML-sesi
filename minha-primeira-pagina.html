<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Patinhas</title>
</head>
<body>
    <h1>Clube Patinhas</h1> <!-- h1 é uma tag de titulo -->
    <!-- Um unico h1 por pagina: o assunto principal -->
     <!-- Existe seis niveis de titulos (h1 a h6) Segue a sequencia (h1 > h2 > h3 > h4 > h5 > h6) -->
      <h2>Como cuidar</h2>
      <h3>Alimentação</h3>
      <p>Escove os desntes<em>so com pastas para cães</em>.</p>
      <h4>Passeios</h4>
      <p>Filhotes só passeiam <strong>com as vacinas em dias </strong>.</p>
      <!-- a tag p é usada para criar parágrafos de texto -->
       <!-- a tag strong é usada para negrito e a tag em é usada para itálico -->

       <h2>Raças</h2>
       <ul> <!-- ul é uma lista não ordenada -->
        
            <li>Beagles</li>
            <li>Poodle</li>
            <li>Golden Retriever</li>
            <li>Shih Tzu</li>
         </ul>

         <dl>

            <dt>Filhotes</dt>

            <dd>Cão com menos de 1 ano</dd>

         </dl>
         <!-- dl é uma lista de descrição-->
         <!-- dt é a descrição e dd é a definição -->

         <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2w-tD_1dnwoBcAaXEkbLBG5t9bSmqoo4ls9e0Mw2yr7Ye0k1Xu7N-SRQ&s=10" target="_blank"
         rel="noopener noreferrer">Clique aqui para ver uma imagem de cachorro</a>
         <!-- a tag a é usada para criar links -->
          <!-- No atributo href, especificamos a URL do link -->
          <!-- No atributo target, especificamos onde abrir o link -->
          <!-- No atributo rel, especificamos a relação entre a página atual e o destino do link -->

         <img src="cachorro-fofo.jpg" alt="Um cachorro muito fofo.">
</body>
</html>
